name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nxflow
          POSTGRES_PASSWORD: nxflow
          POSTGRES_DB: nxflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxflow -d nxflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NXFLOW_TEST_DATABASE_URL: postgresql+asyncpg://nxflow:nxflow@localhost:5432/nxflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check api/src tests scripts
          mypy api/src
      - name: Test
        run: pytest -q

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        working-directory: cli
        run: cargo build
      - name: Test CLI
        working-directory: cli
        run: cargo test
