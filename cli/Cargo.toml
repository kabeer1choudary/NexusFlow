[package]
name = "nxflow"
version = "0.1.0"
edition = "2021"
description = "NexusFlow terminal CLI"

[[bin]]
name = "nxflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
